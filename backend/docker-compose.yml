services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mrhonda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: mrhonda
    volumes:
      - mrhonda_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrhonda -d mrhonda"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://mrhonda:${POSTGRES_PASSWORD}@db:5432/mrhonda
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?}
      MRHONDA_TOKEN_SECRET: ${MRHONDA_TOKEN_SECRET:?}
      CORS_ORIGINS: https://mr-honda.com,https://www.mr-honda.com
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mrhonda_pgdata: